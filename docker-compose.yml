version: '3.8'

services:
  app:
    build: .
    container_name: snap-link-app
    environment:
      PORT: ${PORT:-8081}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      API_KEY: ${API_KEY:?API_KEY is required}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${PORT:-8081}:${PORT:-8081}"
    restart: unless-stopped
