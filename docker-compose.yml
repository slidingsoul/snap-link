version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: link-shortener-db
    environment:
      POSTGRES_USER: linkadmin
      POSTGRES_PASSWORD: linkpassword123
      POSTGRES_DB: link_shortener
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkadmin"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: link-shortener-app
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://linkadmin:linkpassword123@postgres:5432/link_shortener"
      LOG_LEVEL: "info"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
