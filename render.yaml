services:
  - type: web
    name: snap-link
    runtime: go
    buildCommand: go build -o snap-link .
    startCommand: ./snap-link
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8081
      # External DB (Neon): set DATABASE_URL manually in the Render dashboard.
      # Format: postgresql://user:password@ep-xxxxx.neon.tech/dbname?sslmode=require
      - key: DATABASE_URL
        sync: false
      # NOTE: generateValue creates a random key on first deploy.
      # Copy it from the Render dashboard into your API clients;
      # rotating it here will invalidate existing clients.
      - key: API_KEY
        generateValue: true
