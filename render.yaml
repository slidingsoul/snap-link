services:
  - type: web
    name: snap-link
    runtime: go
    buildCommand: go build -o snap-link .
    startCommand: ./snap-link
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8081
      # External DB (Neon): set DATABASE_URL manually in the Render dashboard.
      # Format: postgresql://user:password@ep-xxxxx.neon.tech/dbname?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Neon Managed Better Auth (per-branch, Console → Branch → Auth).
      # Same branch as DATABASE_URL. JWKS + issuer derived, no secret.
      - key: NEON_AUTH_BASE_URL
        sync: false
