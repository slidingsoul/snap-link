services:
  - type: web
    name: snap-link
    runtime: go
    buildCommand: go build -o snap-link .
    startCommand: ./snap-link
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: snap-link-db
          property: connectionString
      - key: API_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: info

databases:
  - name: snap-link-db
    databaseName: snap_link
    user: linkadmin
    plan: free
